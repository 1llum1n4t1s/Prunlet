name: Prunlet Linux release packages

# Linux版の配布tar.gzをGitHub提供ランナーでビルド・検証し、署名付きマニフェストと一緒にCloudflare R2へ配信する。
# GitHub Release もタグも使わない。R2（https://prunlet.kagayoi.com）が唯一の配布元。
# - release/<版> ブランチへのpush: ビルド・検証のあと、publish jobがR2へ配信する（Windowsの配布と同じ契機）。
# - workflow_dispatch: 同じ release/<版> のrefを選んだ再実行、または release/* 以外のrefでの検証だけの実行
#   （この場合はbuild jobの検証とartifact化のみで、publish jobは動かない）。
# build jobはSecretsを持たない。publish job（Environment `release`。release/* だけを許可）だけが、
# R2書込みトークンとマニフェスト署名鍵（PRUNLET_RELEASE_SIGNING_KEY）を受け取る。
# 公開の順序: tar.gz（create-only）→ 公開URLで照合 → 版マニフェスト（署名・create-only）→ 最新ポインタ →
# 手動取得用の固定名 download/latest/prunlet-linux-<cpu>.tar.gz と .sha256（最後に置換）。
# Linux版の起動時自動更新は、このworkflowが配信するtar.gzだけを読む。tarの中身・manifest・64 MiB上限は
# scripts/Publish-PrunletLinux.shが作り、起動側（package.rs）と配信側（scripts/PrunletPackage.Common.ps1）が同じ条件で照合する。

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prunlet-release-linux
  cancel-in-progress: false

jobs:
  build:
    # ubuntu-latestは26.04へ移りglibc要件が2.39を超えるため、x64もubuntu-24.04へ固定する（arm64のubuntu-24.04-armと揃う）。
    if: ${{ github.repository == '1llum1n4t1s/Prunlet' }}
    name: build ${{ matrix.runtime }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runtime: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          version="$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\([^"]*\)"$/\1/p' | head -n 1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$GITHUB_REF_TYPE" = branch ] && [[ "$GITHUB_REF_NAME" == release/* ]]; then
            # release/<版> のブランチだけが配信の対象。ブランチ名とCargo.tomlの版、HEADとイベントcommit、既定ブランチの祖先を検査する
            # （Windows版のworkflowと同じ検査。scripts/Assert-PrunletReleaseRef.ps1）。
            [ "$GITHUB_REF_NAME" = "release/$version" ] || { echo 'The branch name does not match the Cargo.toml version.' >&2; exit 1; }
            [ "$commit" = "$GITHUB_SHA" ] || { echo 'Checkout differs from the event commit.' >&2; exit 1; }
            branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
            [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo 'Default branch is invalid.' >&2; exit 1; }
            git merge-base --is-ancestor "$commit" "refs/remotes/origin/$branch" || { echo 'Release commit is not on the default branch.' >&2; exit 1; }
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Verify the runner
        run: |
          set -euo pipefail
          # docs/linux.mdのglibc 2.39（Ubuntu 24.04）をビルド環境の前提にする。ubuntu-latestが
          # 別の版へ移ったときは、要件が変わるため黙って進めず止める。
          . /etc/os-release
          [ "$ID" = ubuntu ] && [ "$VERSION_ID" = 24.04 ] || { echo "Unexpected runner OS: $ID $VERSION_ID" >&2; exit 1; }
          case "${{ matrix.runtime }}" in
            linux-x64) [ "$(uname -m)" = x86_64 ] ;;
            linux-arm64) [ "$(uname -m)" = aarch64 ] ;;
          esac
          ldd --version | head -n 1
      - name: Prepare Rust
        run: |
          set -euo pipefail
          # rust-toolchain.tomlが指定する版・componentを導入し、対象のtargetを追加する。
          rustup show active-toolchain || rustup toolchain install
          rustup target add "${{ matrix.target }}"
          rustc --version
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Run the Rust tests
        run: |
          set -euo pipefail
          # 共有されるホームのTrashへ触れないよう、テストごとの一時領域をRUNNER_TEMPへ向ける。
          export TMPDIR="$RUNNER_TEMP/cargo-test-tmp"
          mkdir "$TMPDIR"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-test-target"
          cargo test --locked --lib
          cargo test --locked --test localization
      - name: Build and package
        id: package
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-${{ matrix.runtime }}"
          bash scripts/Publish-PrunletLinux.sh "$out" "${{ steps.source.outputs.commit }}" "${{ matrix.runtime }}"
          echo "output=$out" >> "$GITHUB_OUTPUT"
      - name: Check the package and the glibc requirement
        run: |
          set -euo pipefail
          out="${{ steps.package.outputs.output }}"
          asset="prunlet-${{ matrix.runtime }}.tar.gz"
          archive="$out/$asset"
          # 起動側（package.rs）の要件を、成果物から独立に再確認する。
          [ "$(tar -tzf "$archive")" = "$(printf 'prunlet\nmanifest.json\n')" ]
          [ "$(stat -c %s "$archive")" -le 67108864 ]
          (cd "$out" && sha256sum -c "$asset.sha256")
          verify="$RUNNER_TEMP/verify-${{ matrix.runtime }}"
          mkdir "$verify"
          tar -xzf "$archive" -C "$verify"
          exe="$verify/prunlet"
          manifest="$verify/manifest.json"
          [ "$(stat -c %s "$exe")" -le 67108864 ]
          jq -e --arg v "$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" --arg c "${{ steps.source.outputs.commit }}" --arg r "${{ matrix.runtime }}" \
            '(keys | sort) == ["bytes","commit","runtime","sha256","version"] and .version == $v and .commit == $c and .runtime == $r' "$manifest"
          [ "$(jq -r .bytes "$manifest")" = "$(stat -c %s "$exe")" ]
          [ "$(jq -r .sha256 "$manifest")" = "$(sha256sum "$exe" | cut -d' ' -f1)" ]
          # 実行体のglibc要件がdocs/linux.mdの2.39以下であることを確認する。
          required="$(objdump -T "$exe" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -n 1)"
          echo "Highest required glibc symbol version: $required"
          [ -n "$required" ]
          [ "$(printf '%s\n%s\n' "$required" 2.39 | sort -V | tail -n 1)" = 2.39 ] || { echo "glibc $required exceeds the documented 2.39." >&2; exit 1; }
          # 動的リンクの不足がないこと（ローダーが全ライブラリを解決できること）。
          ! ldd "$exe" | grep -q 'not found'
          "$exe" --linux-build-info
          {
            echo "### ${{ matrix.runtime }}"
            echo "- asset: \`$asset\` ($(stat -c %s "$archive") bytes)"
            echo "- sha256: \`$(cut -d' ' -f1 "$archive.sha256")\`"
            echo "- executable: $(stat -c %s "$exe") bytes, sha256 \`$(jq -r .sha256 "$manifest")\`"
            echo "- highest glibc: $required (documented 2.39)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify files, MCP and hook with the distributed executable
        run: |
          set -euo pipefail
          # 配布tar.gzから取り出した実行体そのものを、隔離したXDG_DATA_HOMEで検証する。
          bun --no-env-file scripts/Verify-LinuxFiles.ts "$RUNNER_TEMP/verify-${{ matrix.runtime }}/prunlet" "$RUNNER_TEMP/files-e2e-${{ matrix.runtime }}"
      - name: Verify the startup update
        run: |
          set -euo pipefail
          # R2（https://prunlet.kagayoi.com）の応答だけをfixtureへ置換するデバッグビルド（prunlet_linux_update_tests）を、
          # 版とコミットが異なる3世代で作り、公開物と同じustar形式のtar.gzから2回更新する。
          base="$RUNNER_TEMP/update-fixture"
          mkdir "$base"
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          IFS=. read -r major minor patch <<< "$version"
          build() {
            local name="$1" fixture_version="$2" fixture_commit="$3" src="$base/src-$1"
            mkdir "$src"
            git archive HEAD | tar -x -C "$src"
            sed -i "0,/^version = \".*\"\$/s//version = \"$fixture_version\"/" "$src/Cargo.toml"
            sed -i "/^name = \"prunlet\"\$/{n;s/^version = .*/version = \"$fixture_version\"/}" "$src/Cargo.lock"
            (
              cd "$src"
              export PRUNLET_SOURCE_COMMIT="$fixture_commit" RUSTFLAGS='--cfg prunlet_linux_update_tests' CARGO_TARGET_DIR="$base/target" CARGO_PROFILE_DEV_DEBUG=0
              cargo build --locked --bin prunlet
            )
            install -m 755 "$base/target/debug/prunlet" "$base/$name-prunlet"
            [ "$(stat -c %s "$base/$name-prunlet")" -le 67108864 ]
          }
          pack() {
            local name="$1" dir="$base/pack-$1" info
            mkdir "$dir"
            install -m 755 "$base/$name-prunlet" "$dir/prunlet"
            info="$("$dir/prunlet" --linux-build-info)"
            printf '{"version":"%s","commit":"%s","runtime":"%s","bytes":%s,"sha256":"%s"}\n' \
              "$(jq -r .version <<< "$info")" "$(jq -r .commit <<< "$info")" "$(jq -r .runtime <<< "$info")" \
              "$(stat -c %s "$dir/prunlet")" "$(sha256sum "$dir/prunlet" | cut -d' ' -f1)" > "$dir/manifest.json"
            chmod 644 "$dir/manifest.json"
            tar --format=ustar -czf "$base/$name.tar.gz" -C "$dir" prunlet manifest.json
            [ "$(stat -c %s "$base/$name.tar.gz")" -le 67108864 ]
          }
          build a "$version" 1111111111111111111111111111111111111111
          build b "$major.$minor.$((patch + 1))" 2222222222222222222222222222222222222222
          build c "$major.$minor.$((patch + 2))" 3333333333333333333333333333333333333333
          pack b
          pack c
          bun --no-env-file scripts/Verify-UnixStartupUpdate.ts "$RUNNER_TEMP/update-e2e-${{ matrix.runtime }}" "$base/a-prunlet" "$base/b.tar.gz" "$base/c.tar.gz"
      - name: Upload the verified packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prunlet-${{ matrix.runtime }}
          path: |
            ${{ steps.package.outputs.output }}/prunlet-${{ matrix.runtime }}.tar.gz
            ${{ steps.package.outputs.output }}/prunlet-${{ matrix.runtime }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    # 検証済みの両CPUのpackageだけを、署名付きマニフェストと一緒にR2へ配信する。release/<版> のブランチの実行だけで動き、
    # それ以外のref（検証だけの実行）ではskipする（Environmentの拒否で失敗させない）。
    # pwshのR2スクリプト（scripts/Publish-PrunletLinuxR2.ps1）を使うため windows-latest で動かす。
    # build jobで作った実物は、ここでも中身（ustar・2エントリ・manifest・上限・.sha256）を独立に検査する。
    if: ${{ github.repository == '1llum1n4t1s/Prunlet' && github.ref_type == 'branch' && startsWith(github.ref_name, 'release/') }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    env:
      PRUNLET_R2_BUCKET: ${{ vars.PRUNLET_R2_BUCKET || 'prunlet-updates' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Assert-PrunletReleaseRef.ps1
      - name: Check the signing key against the client public keys
        # 鍵整合の関門。クライアント側3か所（Rust・Install-Prunlet.ps1・Install-Prunlet.sh）の公開鍵定数のすべてで試験封筒を検証できなければ、R2へ何も書かず止める。
        env:
          PRUNLET_RELEASE_SIGNING_KEY: ${{ secrets.PRUNLET_RELEASE_SIGNING_KEY }}
        run: ./scripts/Test-PrunletReleaseKeyGate.ps1
      - name: Download the verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prunlet-linux-*
          path: ${{ runner.temp }}/packages
      - name: Check the packages against R2 before any write
        # 両CPUについて、読取りだけで既存の版マニフェスト・最新ポインタ（後退）を検査する。署名鍵は渡さない。
        env:
          PRUNLET_COMMIT: ${{ steps.source.outputs.commit }}
          PRUNLET_BRANCH: ${{ steps.source.outputs.branch }}
          PRUNLET_VERSION: ${{ steps.source.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRUNLET_R2_ACCOUNT_ID: ${{ secrets.PRUNLET_R2_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($runtime in @('linux-x64', 'linux-arm64')) {
            $package = Join-Path $env:RUNNER_TEMP "packages/prunlet-$runtime/prunlet-$runtime.tar.gz"
            & ./scripts/Publish-PrunletLinuxR2.ps1 -PackagePath $package -Runtime $runtime -Version $env:PRUNLET_VERSION -CommitSha $env:PRUNLET_COMMIT -DefaultBranch $env:PRUNLET_BRANCH -CheckOnly
          }
      - name: Publish the signed Linux packages to R2
        # tar.gz（create-only）→ 公開URLで照合 → 版マニフェスト（署名・create-only）→ 最新ポインタ → 固定名（.sha256が最後）。
        # 公開後に $LASTEXITCODE を見ない（スクリプトは失敗を例外で知らせる）。
        env:
          PRUNLET_COMMIT: ${{ steps.source.outputs.commit }}
          PRUNLET_BRANCH: ${{ steps.source.outputs.branch }}
          PRUNLET_VERSION: ${{ steps.source.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRUNLET_R2_ACCOUNT_ID: ${{ secrets.PRUNLET_R2_ACCOUNT_ID }}
          PRUNLET_RELEASE_SIGNING_KEY: ${{ secrets.PRUNLET_RELEASE_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($runtime in @('linux-x64', 'linux-arm64')) {
            $package = Join-Path $env:RUNNER_TEMP "packages/prunlet-$runtime/prunlet-$runtime.tar.gz"
            & ./scripts/Publish-PrunletLinuxR2.ps1 -PackagePath $package -Runtime $runtime -Version $env:PRUNLET_VERSION -CommitSha $env:PRUNLET_COMMIT -DefaultBranch $env:PRUNLET_BRANCH
          }
