name: Prunlet Linux release packages

# Linux版の配布tar.gzをGitHub提供ランナーでビルド・検証し、同じReleaseへ添付する。
# - release published: 公開タグから自動で実行する（Windows・Macの配布と同じ契機）。
# - workflow_dispatch: 過去タグへの後付け、または添付しない検証（artifact化のみ）に使う。
#   tagを空にすると起動したrefをそのまま検証し、添付はしない。tagを指定しても、attachがtrueでなければ添付しない。
# Linux版の起動時自動更新（src/rust/platform/linux/startup.rs・update/github.rs）は、このworkflowが添付する
# prunlet-linux-{x64,arm64}.tar.gzだけを読む。asset名・tarの中身・manifest・64 MiB上限は
# scripts/Publish-PrunletLinux.shが作り、起動側（package.rs）が同じ条件で照合する。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example v1.0.47). Empty builds the dispatched ref without attaching.'
        required: false
        default: ''
        type: string
      attach:
        description: 'Attach the verified packages to the release of the tag (never overwrites an existing asset).'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: prunlet-linux-release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  PRUNLET_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    # ubuntu-latestは26.04へ移りglibc要件が2.39を超えるため、x64もubuntu-24.04へ固定する（arm64のubuntu-24.04-armと揃う）。
    # 非公開（draft・prerelease）のreleaseは対象外にする。dispatchは実行者の責任で動かす。
    if: ${{ github.repository == '1llum1n4t1s/Prunlet' && (github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft)) }}
    name: build ${{ matrix.runtime }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runtime: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$PRUNLET_TAG" ]; then
            # 公開タグ（既定ブランチ上のコミット）だけをビルドする。Windows版のworkflowと同じ検査。
            [[ "$PRUNLET_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.-]+)?$ ]] || { echo 'Unsupported release tag.' >&2; exit 1; }
            if [ "$GITHUB_EVENT_NAME" = release ] && [ "$commit" != "$GITHUB_SHA" ]; then
              echo 'Checkout differs from the release event commit.' >&2; exit 1
            fi
            tag_commit="$(git rev-list -n 1 "refs/tags/$PRUNLET_TAG")"
            [ "$tag_commit" = "$commit" ] || { echo 'Checkout does not match the release tag.' >&2; exit 1; }
            branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
            [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo 'Default branch is invalid.' >&2; exit 1; }
            git merge-base --is-ancestor "$commit" "refs/remotes/origin/$branch" || { echo 'Release commit is not on the default branch.' >&2; exit 1; }
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Verify the runner
        run: |
          set -euo pipefail
          # docs/linux.mdのglibc 2.39（Ubuntu 24.04）をビルド環境の前提にする。ubuntu-latestが
          # 別の版へ移ったときは、要件が変わるため黙って進めず止める。
          . /etc/os-release
          [ "$ID" = ubuntu ] && [ "$VERSION_ID" = 24.04 ] || { echo "Unexpected runner OS: $ID $VERSION_ID" >&2; exit 1; }
          case "${{ matrix.runtime }}" in
            linux-x64) [ "$(uname -m)" = x86_64 ] ;;
            linux-arm64) [ "$(uname -m)" = aarch64 ] ;;
          esac
          ldd --version | head -n 1
      - name: Prepare Rust
        run: |
          set -euo pipefail
          # rust-toolchain.tomlが指定する版・componentを導入し、対象のtargetを追加する。
          rustup show active-toolchain || rustup toolchain install
          rustup target add "${{ matrix.target }}"
          rustc --version
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Run the Rust tests
        run: |
          set -euo pipefail
          # 共有されるホームのTrashへ触れないよう、テストごとの一時領域をRUNNER_TEMPへ向ける。
          export TMPDIR="$RUNNER_TEMP/cargo-test-tmp"
          mkdir "$TMPDIR"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-test-target"
          cargo test --locked --lib
          cargo test --locked --test localization
      - name: Build and package
        id: package
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-${{ matrix.runtime }}"
          bash scripts/Publish-PrunletLinux.sh "$out" "${{ steps.source.outputs.commit }}" "${{ matrix.runtime }}"
          echo "output=$out" >> "$GITHUB_OUTPUT"
      - name: Check the package and the glibc requirement
        run: |
          set -euo pipefail
          out="${{ steps.package.outputs.output }}"
          asset="prunlet-${{ matrix.runtime }}.tar.gz"
          archive="$out/$asset"
          # 起動側（package.rs）の要件を、成果物から独立に再確認する。
          [ "$(tar -tzf "$archive")" = "$(printf 'prunlet\nmanifest.json\n')" ]
          [ "$(stat -c %s "$archive")" -le 67108864 ]
          (cd "$out" && sha256sum -c "$asset.sha256")
          verify="$RUNNER_TEMP/verify-${{ matrix.runtime }}"
          mkdir "$verify"
          tar -xzf "$archive" -C "$verify"
          exe="$verify/prunlet"
          manifest="$verify/manifest.json"
          [ "$(stat -c %s "$exe")" -le 67108864 ]
          jq -e --arg v "$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" --arg c "${{ steps.source.outputs.commit }}" --arg r "${{ matrix.runtime }}" \
            '(keys | sort) == ["bytes","commit","runtime","sha256","version"] and .version == $v and .commit == $c and .runtime == $r' "$manifest"
          [ "$(jq -r .bytes "$manifest")" = "$(stat -c %s "$exe")" ]
          [ "$(jq -r .sha256 "$manifest")" = "$(sha256sum "$exe" | cut -d' ' -f1)" ]
          # 実行体のglibc要件がdocs/linux.mdの2.39以下であることを確認する。
          required="$(objdump -T "$exe" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -n 1)"
          echo "Highest required glibc symbol version: $required"
          [ -n "$required" ]
          [ "$(printf '%s\n%s\n' "$required" 2.39 | sort -V | tail -n 1)" = 2.39 ] || { echo "glibc $required exceeds the documented 2.39." >&2; exit 1; }
          # 動的リンクの不足がないこと（ローダーが全ライブラリを解決できること）。
          ! ldd "$exe" | grep -q 'not found'
          "$exe" --linux-build-info
          {
            echo "### ${{ matrix.runtime }}"
            echo "- asset: \`$asset\` ($(stat -c %s "$archive") bytes)"
            echo "- sha256: \`$(cut -d' ' -f1 "$archive.sha256")\`"
            echo "- executable: $(stat -c %s "$exe") bytes, sha256 \`$(jq -r .sha256 "$manifest")\`"
            echo "- highest glibc: $required (documented 2.39)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify files, MCP and hook with the distributed executable
        run: |
          set -euo pipefail
          # 配布tar.gzから取り出した実行体そのものを、隔離したXDG_DATA_HOMEで検証する。
          bun --no-env-file scripts/Verify-LinuxFiles.ts "$RUNNER_TEMP/verify-${{ matrix.runtime }}/prunlet" "$RUNNER_TEMP/files-e2e-${{ matrix.runtime }}"
      - name: Verify the startup update
        run: |
          set -euo pipefail
          # GitHub応答だけをfixtureへ置換するデバッグビルド（prunlet_linux_update_tests）を、
          # 版とコミットが異なる3世代で作り、公開物と同じustar形式のtar.gzから2回更新する。
          base="$RUNNER_TEMP/update-fixture"
          mkdir "$base"
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          IFS=. read -r major minor patch <<< "$version"
          build() {
            local name="$1" fixture_version="$2" fixture_commit="$3" src="$base/src-$1"
            mkdir "$src"
            git archive HEAD | tar -x -C "$src"
            sed -i "0,/^version = \".*\"\$/s//version = \"$fixture_version\"/" "$src/Cargo.toml"
            sed -i "/^name = \"prunlet\"\$/{n;s/^version = .*/version = \"$fixture_version\"/}" "$src/Cargo.lock"
            (
              cd "$src"
              export PRUNLET_SOURCE_COMMIT="$fixture_commit" RUSTFLAGS='--cfg prunlet_linux_update_tests' CARGO_TARGET_DIR="$base/target" CARGO_PROFILE_DEV_DEBUG=0
              cargo build --locked --bin prunlet
            )
            install -m 755 "$base/target/debug/prunlet" "$base/$name-prunlet"
            [ "$(stat -c %s "$base/$name-prunlet")" -le 67108864 ]
          }
          pack() {
            local name="$1" dir="$base/pack-$1" info
            mkdir "$dir"
            install -m 755 "$base/$name-prunlet" "$dir/prunlet"
            info="$("$dir/prunlet" --linux-build-info)"
            printf '{"version":"%s","commit":"%s","runtime":"%s","bytes":%s,"sha256":"%s"}\n' \
              "$(jq -r .version <<< "$info")" "$(jq -r .commit <<< "$info")" "$(jq -r .runtime <<< "$info")" \
              "$(stat -c %s "$dir/prunlet")" "$(sha256sum "$dir/prunlet" | cut -d' ' -f1)" > "$dir/manifest.json"
            chmod 644 "$dir/manifest.json"
            tar --format=ustar -czf "$base/$name.tar.gz" -C "$dir" prunlet manifest.json
            [ "$(stat -c %s "$base/$name.tar.gz")" -le 67108864 ]
          }
          build a "$version" 1111111111111111111111111111111111111111
          build b "$major.$minor.$((patch + 1))" 2222222222222222222222222222222222222222
          build c "$major.$minor.$((patch + 2))" 3333333333333333333333333333333333333333
          pack b
          pack c
          bun --no-env-file scripts/Verify-UnixStartupUpdate.ts "$RUNNER_TEMP/update-e2e-${{ matrix.runtime }}" "$base/a-prunlet" "$base/b.tar.gz" "$base/c.tar.gz"
      - name: Upload the verified packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prunlet-${{ matrix.runtime }}
          path: |
            ${{ steps.package.outputs.output }}/prunlet-${{ matrix.runtime }}.tar.gz
            ${{ steps.package.outputs.output }}/prunlet-${{ matrix.runtime }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  attach:
    # 検証済みの両CPUのpackageだけを、既存のReleaseへ添付する。既存assetは上書きしない。
    if: ${{ github.repository == '1llum1n4t1s/Prunlet' && (github.event_name == 'release' || (inputs.attach && inputs.tag != '')) }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prunlet-linux-*
          path: ${{ runner.temp }}/packages
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PRUNLET_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.-]+)?$ ]]
          release="$(gh release view "$PRUNLET_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName)"
          [ "$(jq -r '.isDraft or .isPrerelease' <<< "$release")" = false ] || { echo 'The release is a draft or prerelease.' >&2; exit 1; }
          # ビルドした実物が、今のタグ（既定ブランチ上のコミット）と同じコミットのものであることを確認する。
          tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$PRUNLET_TAG" --jq .sha)"
          for runtime in linux-x64 linux-arm64; do
            dir="$RUNNER_TEMP/packages/prunlet-$runtime"
            asset="prunlet-$runtime.tar.gz"
            [ -f "$dir/$asset" ] && [ -f "$dir/$asset.sha256" ] || { echo "Missing verified package: $runtime" >&2; exit 1; }
            (cd "$dir" && sha256sum -c "$asset.sha256")
            [ "$(tar -xOzf "$dir/$asset" manifest.json | jq -r .commit)" = "$tag_commit" ] || { echo "Package commit differs from the tag: $runtime" >&2; exit 1; }
          done
          for runtime in linux-x64 linux-arm64; do
            dir="$RUNNER_TEMP/packages/prunlet-$runtime"
            for asset in "prunlet-$runtime.tar.gz" "prunlet-$runtime.tar.gz.sha256"; do
              local_sha="$(sha256sum "$dir/$asset" | cut -d' ' -f1)"
              existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PRUNLET_TAG" --jq ".assets[] | select(.name == \"$asset\") | .digest")"
              if [ -n "$existing" ]; then
                # 既存assetは上書きしない。同一内容ならそのまま使い、異なれば失敗する。
                [ "$existing" = "sha256:$local_sha" ] || { echo "An existing asset differs and was not overwritten: $asset" >&2; exit 1; }
                echo "Already attached with identical content: $asset"
                continue
              fi
              gh release upload "$PRUNLET_TAG" "$dir/$asset" --repo "$GITHUB_REPOSITORY"
            done
          done
          # GitHubが返したasset名・サイズ・SHA-256を、手元の実物と照合する。
          for runtime in linux-x64 linux-arm64; do
            dir="$RUNNER_TEMP/packages/prunlet-$runtime"
            for asset in "prunlet-$runtime.tar.gz" "prunlet-$runtime.tar.gz.sha256"; do
              row="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PRUNLET_TAG" --jq ".assets[] | select(.name == \"$asset\") | \"\(.state) \(.size) \(.digest)\"")"
              [ "$row" = "uploaded $(stat -c %s "$dir/$asset") sha256:$(sha256sum "$dir/$asset" | cut -d' ' -f1)" ] || { echo "Attached asset differs from the verified file: $asset ($row)" >&2; exit 1; }
              echo "Verified: $asset $row"
            done
          done
