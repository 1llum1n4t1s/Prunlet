name: Dependency validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Rust target
        run: |
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: |
          & ./scripts/Publish-Prunlet.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'prunlet-build') -IncludeVerificationProbe | Out-Null
      - name: Run CLI MCP and hook E2E
        run: |
          $report = Join-Path $env:RUNNER_TEMP "prunlet-dependency-verification.json"
          # 出力先は使い捨ての即時削除ボリューム、ゴミ箱往復の fixture は C: の長い名前のプロファイル配下（ゴミ箱有効）に分ける。
          # RUNNER_TEMP 配下の fixture は CREATOR OWNER の継承で ACL の並びがゴミ箱往復後に変わるため使わない。
          $immediate = & ./scripts/New-CIImmediateVolume.ps1
          $runRoot = $immediate.OutputDirectory
          $fixture = Join-Path $env:USERPROFILE 'Prunlet-CI-Fixture'
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          Write-Host ('immediate volume: ' + $immediate.VolumeGuid + ' NukeOnDelete=' + $immediate.NukeOnDelete + ' output=' + $runRoot)
          Write-Host ('fixture root SDDL: ' + (Get-Acl -LiteralPath $fixture).Sddl)
          Write-Host ('output volume root SDDL: ' + (Get-Acl -LiteralPath ([IO.Path]::GetPathRoot($runRoot))).Sddl)
          $build = Join-Path $env:RUNNER_TEMP 'prunlet-build'
          $manifest = Join-Path $build 'build-manifest.json'
          $manifestHash = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash
          & ./scripts/Verify-RecordlessFiles.ps1 -ExecutablePath (Join-Path $build 'publish/prunlet.exe') -RustProbePath (Join-Path $build 'publish/prunlet-verification.exe') -BuildManifestPath $manifest -ExpectedBuildManifestSha256 $manifestHash -FixtureRoot $fixture -OutputDirectory $runRoot -ReportPath $report
          $verificationExitCode = $LASTEXITCODE
          if (Test-Path -LiteralPath $report) {
            $verification = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            $verification.results | Select-Object name, passed, skipped, note, error | ConvertTo-Json -Depth 4
            # 失敗した case は、原因の切り分けに必要な stack と観測値（ACL の前後・失敗項目など）も出す。
            # 観測値は大きくなり得るため、1 case あたり 8000 文字で切る。失敗の判定は変えない。
            foreach ($failed in @($verification.results | Where-Object { $_.passed -eq $false })) {
              $observed = if ($null -ne $failed.observed) { $failed.observed | ConvertTo-Json -Depth 8 -Compress } else { '' }
              if ($observed.Length -gt 8000) { $observed = $observed.Substring(0, 8000) + '...(truncated)' }
              Write-Host ("::group::failed case detail: " + $failed.name)
              Write-Host ("stack: " + $failed.stack)
              Write-Host ("observed: " + $observed)
              Write-Host '::endgroup::'
            }
          }
          if ($verificationExitCode -ne 0) { exit $verificationExitCode }
          if (!(Test-Path -LiteralPath $report -PathType Leaf)) { throw 'Required E2E report was not produced.' }
          if ($verification.failed -ne 0 -or $verification.skipped -ne 0 -or $verification.executedCount -ne $verification.selectedExpectedCount) { throw 'E2E requires zero failures, zero skips and every selected case executed.' }
