name: Dependency validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet restore src/Prunlet/Prunlet.csproj -p:BaseIntermediateOutputPath="$env:RUNNER_TEMP/prunlet-obj/" -p:BaseOutputPath="$env:RUNNER_TEMP/prunlet-bin/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: |
          dotnet build src/Prunlet/Prunlet.csproj -c Release --no-restore -p:BaseIntermediateOutputPath="$env:RUNNER_TEMP/prunlet-obj/" -p:BaseOutputPath="$env:RUNNER_TEMP/prunlet-bin/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run CLI MCP and hook E2E
        run: |
          $report = Join-Path $env:RUNNER_TEMP "prunlet-dependency-verification.json"
          $runRoot = Join-Path $env:RUNNER_TEMP ("prunlet-e2e-" + [guid]::NewGuid().ToString("N"))
          & ./scripts/Verify-Prunlet.ps1 -ExecutablePath (Join-Path $env:RUNNER_TEMP "prunlet-bin/Release/net10.0-windows/prunlet.exe") -OutputDirectory $runRoot -ReportPath $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
