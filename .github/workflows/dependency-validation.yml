name: Dependency validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Rust target
        run: |
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: |
          & ./scripts/Publish-Prunlet.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'prunlet-build') -IncludeVerificationProbe | Out-Null
      - name: Run CLI MCP and hook E2E
        run: |
          $report = Join-Path $env:RUNNER_TEMP "prunlet-dependency-verification.json"
          $runRoot = Join-Path $env:RUNNER_TEMP ("prunlet-e2e-" + [guid]::NewGuid().ToString("N"))
          $build = Join-Path $env:RUNNER_TEMP 'prunlet-build'
          $manifest = Join-Path $build 'build-manifest.json'
          $manifestHash = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash
          & ./scripts/Verify-RecordlessFiles.ps1 -ExecutablePath (Join-Path $build 'publish/prunlet.exe') -RustProbePath (Join-Path $build 'publish/prunlet-verification.exe') -BuildManifestPath $manifest -ExpectedBuildManifestSha256 $manifestHash -OutputDirectory $runRoot -ReportPath $report
          $verificationExitCode = $LASTEXITCODE
          if (Test-Path -LiteralPath $report) {
            $verification = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            $verification.results | Select-Object name, passed, skipped, note, error | ConvertTo-Json -Depth 4
          }
          if ($verificationExitCode -ne 0) { exit $verificationExitCode }
