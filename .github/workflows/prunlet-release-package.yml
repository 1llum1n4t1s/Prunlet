name: Prunlet release packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    # Windowsの更新ZIPはSimplySignで署名するため、リリース担当者の機械で
    # scripts/Publish-PrunletWindows.ps1が生成し、公開前のreleaseへ添付する。
    # このjobは添付済みZIPを公開タグのsourceと署名で検証し、既存のR2へ配置するだけで、
    # ビルド・releaseへの書込みは行わない。
    if: ${{ github.repository == '1llum1n4t1s/Prunlet' && !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the released commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PRUNLET_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PRUNLET_TAG -cnotmatch '^v?[0-9]+\.[0-9]+\.[0-9]+(?:[-.][A-Za-z0-9.-]+)?$') { throw 'Unsupported release tag.' }
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -cnotmatch '^[0-9a-f]{40}$') { throw 'Checkout commit is invalid.' }
          if ($commit -cne $env:GITHUB_SHA) { throw 'Checkout differs from the release event commit.' }
          $tagCommit = (git rev-list -n 1 ('refs/tags/' + $env:PRUNLET_TAG)).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $commit) { throw 'Checkout does not match the release tag.' }
          $branch = (gh api "repos/$env:GITHUB_REPOSITORY" --jq '.default_branch').Trim()
          if ($LASTEXITCODE -ne 0 -or $branch -cnotmatch '^[A-Za-z0-9._/-]+$') { throw 'Default branch is invalid.' }
          git merge-base --is-ancestor $commit ('refs/remotes/origin/' + $branch)
          if ($LASTEXITCODE -ne 0) { throw 'Release commit is not on the default branch.' }
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "branch=$branch" >> $env:GITHUB_OUTPUT
      - name: Download the signed package attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRUNLET_TAG: ${{ github.event.release.tag_name }}
          PRUNLET_RUNTIME: ${{ matrix.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP ('prunlet-download-' + $env:PRUNLET_RUNTIME)
          $name = 'prunlet-update-' + $env:PRUNLET_RUNTIME + '.zip'
          gh release download $env:PRUNLET_TAG --repo $env:GITHUB_REPOSITORY --pattern $name --dir $directory
          if ($LASTEXITCODE -ne 0) { throw "Signed package $name is not attached to the release; attach the output of Publish-PrunletWindows.ps1 before publishing." }
          # GitHubが記録したassetのsize・digestと、取得した実物を照合する。
          $asset = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:PRUNLET_TAG" --jq ".assets[] | select(.name == `"$name`") | {size, digest}" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$asset) { throw 'Release asset metadata is unavailable.' }
          $package = Join-Path $directory $name
          if ((Get-Item -LiteralPath $package).Length -ne $asset.size) { throw 'Downloaded package size differs from the release asset.' }
          if ($asset.digest -and $asset.digest -cne ('sha256:' + (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant())) { throw 'Downloaded package digest differs from the release asset.' }
      - name: Verify the signed package
        # R2送信スクリプトは失敗理由を伏せるため、署名・版などの不一致を読めるよう単独で先に検証する。
        env:
          PRUNLET_COMMIT: ${{ steps.source.outputs.commit }}
          PRUNLET_BRANCH: ${{ steps.source.outputs.branch }}
          PRUNLET_RUNTIME: ${{ matrix.runtime }}
          PRUNLET_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP ('prunlet-download-' + $env:PRUNLET_RUNTIME + '/prunlet-update-' + $env:PRUNLET_RUNTIME + '.zip')
          $extract = Join-Path $env:RUNNER_TEMP ('prunlet-verify-' + $env:PRUNLET_RUNTIME)
          $expectedVersion = $env:PRUNLET_TAG -replace '^v', ''
          & ./scripts/Verify-ReleasePackage.ps1 -PackagePath $package -SourceRoot $env:GITHUB_WORKSPACE -CommitSha $env:PRUNLET_COMMIT -DefaultBranch $env:PRUNLET_BRANCH -Runtime $env:PRUNLET_RUNTIME -Repository $env:GITHUB_REPOSITORY -RequireSignature -ExpectedVersion $expectedVersion -ExtractDirectory $extract
      - name: Verify and publish the signed package to the existing R2 destination
        env:
          PRUNLET_COMMIT: ${{ steps.source.outputs.commit }}
          PRUNLET_BRANCH: ${{ steps.source.outputs.branch }}
          PRUNLET_RUNTIME: ${{ matrix.runtime }}
          PRUNLET_TAG: ${{ github.event.release.tag_name }}
          PRUNLET_R2_ACCOUNT_ID: ${{ secrets.PRUNLET_R2_ACCOUNT_ID }}
          PRUNLET_R2_ACCESS_KEY_ID: ${{ secrets.PRUNLET_R2_ACCESS_KEY_ID }}
          PRUNLET_R2_SECRET_ACCESS_KEY: ${{ secrets.PRUNLET_R2_SECRET_ACCESS_KEY }}
          PRUNLET_R2_BUCKET: ${{ vars.PRUNLET_R2_BUCKET || 'prunlet-updates' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP ('prunlet-download-' + $env:PRUNLET_RUNTIME + '/prunlet-update-' + $env:PRUNLET_RUNTIME + '.zip')
          $extract = Join-Path $env:RUNNER_TEMP ('prunlet-extract-' + $env:PRUNLET_RUNTIME)
          $expectedVersion = $env:PRUNLET_TAG -replace '^v', ''
          # ビルド出力がないため、署名・署名者・タイムスタンプ・版・machine・同梱sourceを検証してから送る。
          & ./scripts/Publish-PrunletR2.ps1 -PackagePath $package -SourceRoot $env:GITHUB_WORKSPACE -CommitSha $env:PRUNLET_COMMIT -DefaultBranch $env:PRUNLET_BRANCH -Runtime $env:PRUNLET_RUNTIME -Repository $env:GITHUB_REPOSITORY -RequireSignature -ExpectedVersion $expectedVersion -ExtractDirectory $extract
