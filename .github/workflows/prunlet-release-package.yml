name: Prunlet release packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: prunlet-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    # 公開タグからwin-x64・win-arm64をビルドし、Sigilune（Certum SimplySignのクラウド鍵）で
    # 署名した実物だけを、既存のR2と同じreleaseへ配置する。
    # 署名用Secrets（SIGILUNE_EMAIL・SIGILUNE_TOTP_URI）は、実行ごとに本人の承認が必要な
    # Environment `release` にだけ置く。別マシンの並列jobが同じTOTP時間枠を使うとCertumが
    # 後者を拒否するため、両runtimeを1つのjobで扱い、同じSigiluneセッションでログインを1回にする。
    if: ${{ github.repository == '1llum1n4t1s/Prunlet' && !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Rust targets
        run: |
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the released commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PRUNLET_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PRUNLET_TAG -cnotmatch '^v?[0-9]+\.[0-9]+\.[0-9]+(?:[-.][A-Za-z0-9.-]+)?$') { throw 'Unsupported release tag.' }
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -cnotmatch '^[0-9a-f]{40}$') { throw 'Checkout commit is invalid.' }
          if ($commit -cne $env:GITHUB_SHA) { throw 'Checkout differs from the release event commit.' }
          $tagCommit = (git rev-list -n 1 ('refs/tags/' + $env:PRUNLET_TAG)).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $commit) { throw 'Checkout does not match the release tag.' }
          $branch = (gh api "repos/$env:GITHUB_REPOSITORY" --jq '.default_branch').Trim()
          if ($LASTEXITCODE -ne 0 -or $branch -cnotmatch '^[A-Za-z0-9._/-]+$') { throw 'Default branch is invalid.' }
          git merge-base --is-ancestor $commit ('refs/remotes/origin/' + $branch)
          if ($LASTEXITCODE -ne 0) { throw 'Release commit is not on the default branch.' }
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "branch=$branch" >> $env:GITHUB_OUTPUT
      - name: Build the released commit
        # 依存crateのbuild scriptも動くため、このstepには署名用Secretsを渡さない。
        env:
          PRUNLET_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedVersion = $env:PRUNLET_TAG -replace '^v', ''
          foreach ($runtime in @('win-x64', 'win-arm64')) {
            $output = Join-Path $env:RUNNER_TEMP ('prunlet-build-' + $runtime)
            & ./scripts/Publish-Prunlet.ps1 -OutputDirectory $output -Runtime $runtime | Out-Null
            foreach ($name in @('prunlet.exe', 'prunlet-maintenance.exe', 'prunlet-hook.exe')) {
              $product = Join-Path $output ('publish/' + $name)
              if (![IO.File]::Exists($product)) { throw "Published product missing: $runtime $name" }
              $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($product).ProductVersion
              if (($version -split '\+')[0] -cne $expectedVersion) { throw "Published product version differs: $runtime $name $version" }
            }
          }
      - name: Set up Sigilune
        # 他のactionと同じくcommit SHAで固定し、同じ版のリリース（SHA-256・Authenticode署名を検証）を導入する。
        uses: 1llum1n4t1s/Sigilune@c9bfdd3958709568b812014cfda2c1bd07b4aec1 # v1.0.0
        with:
          # SHAを更新するとき（Dependabotを含む）は、この版も同じリリースへ揃える。
          version: 1.0.0
      - name: Sign the executables
        # 署名用Secretsはこのstepだけへ渡す。全runtimeを同じセッションで1ファイルずつ署名し、
        # hookを署名済みCLIの複製へ置き換え、署名者・タイムスタンプを確認する。
        env:
          SIGILUNE_EMAIL: ${{ secrets.SIGILUNE_EMAIL }}
          SIGILUNE_TOTP_URI: ${{ secrets.SIGILUNE_TOTP_URI }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Sign-PrunletBuild.ps1 -BuildDirectory (Join-Path $env:RUNNER_TEMP 'prunlet-build-win-x64'), (Join-Path $env:RUNNER_TEMP 'prunlet-build-win-arm64')
      - name: Package and verify
        id: verified_package
        env:
          PRUNLET_COMMIT: ${{ steps.source.outputs.commit }}
          PRUNLET_BRANCH: ${{ steps.source.outputs.branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($runtime in @('win-x64', 'win-arm64')) {
            $publish = Join-Path $env:RUNNER_TEMP ('prunlet-build-' + $runtime + '/publish')
            $package = Join-Path $env:RUNNER_TEMP ('prunlet-update-' + $runtime + '.zip')
            & ./scripts/Package-PrunletUpdate.ps1 -SourceRoot $env:GITHUB_WORKSPACE -PublishDirectory $publish -OutputPath $package -CommitSha $env:PRUNLET_COMMIT -DefaultBranch $env:PRUNLET_BRANCH -Runtime $runtime | Out-Null
            $sha256 = & ./scripts/Verify-ReleasePackage.ps1 -PackagePath $package -SourceRoot $env:GITHUB_WORKSPACE -PublishDirectory $publish -CommitSha $env:PRUNLET_COMMIT -DefaultBranch $env:PRUNLET_BRANCH -Runtime $runtime -Repository $env:GITHUB_REPOSITORY -RequireSignature
            ($runtime.Replace('-', '_') + "=$sha256") >> $env:GITHUB_OUTPUT
          }
      - name: Publish the verified packages to the existing R2 destination
        env:
          PRUNLET_COMMIT: ${{ steps.source.outputs.commit }}
          PRUNLET_BRANCH: ${{ steps.source.outputs.branch }}
          PRUNLET_R2_ACCOUNT_ID: ${{ secrets.PRUNLET_R2_ACCOUNT_ID }}
          PRUNLET_R2_ACCESS_KEY_ID: ${{ secrets.PRUNLET_R2_ACCESS_KEY_ID }}
          PRUNLET_R2_SECRET_ACCESS_KEY: ${{ secrets.PRUNLET_R2_SECRET_ACCESS_KEY }}
          PRUNLET_R2_BUCKET: ${{ vars.PRUNLET_R2_BUCKET || 'prunlet-updates' }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($runtime in @('win-x64', 'win-arm64')) {
            $publish = Join-Path $env:RUNNER_TEMP ('prunlet-build-' + $runtime + '/publish')
            $package = Join-Path $env:RUNNER_TEMP ('prunlet-update-' + $runtime + '.zip')
            & ./scripts/Publish-PrunletR2.ps1 -PackagePath $package -SourceRoot $env:GITHUB_WORKSPACE -PublishDirectory $publish -CommitSha $env:PRUNLET_COMMIT -DefaultBranch $env:PRUNLET_BRANCH -Runtime $runtime -Repository $env:GITHUB_REPOSITORY
          }
      - name: Attach the same packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRUNLET_TAG: ${{ github.event.release.tag_name }}
          PRUNLET_SHA256_WIN_X64: ${{ steps.verified_package.outputs.win_x64 }}
          PRUNLET_SHA256_WIN_ARM64: ${{ steps.verified_package.outputs.win_arm64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($runtime in @('win-x64', 'win-arm64')) {
            $package = Join-Path $env:RUNNER_TEMP ('prunlet-update-' + $runtime + '.zip')
            $expected = if ($runtime -eq 'win-x64') { $env:PRUNLET_SHA256_WIN_X64 } else { $env:PRUNLET_SHA256_WIN_ARM64 }
            if (!$expected -or (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash -cne $expected) { throw "Package changed after verification: $runtime" }
            gh release upload $env:PRUNLET_TAG $package --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed for $runtime; an existing asset was not overwritten." }
          }
