# 更新方針: 毎週月曜09:00（日本時間）、minor/patchを集約、majorは個別PR。
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: '09:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: deps
- package-ecosystem: cargo
  directory: /
  # velopackは版を固定している（Cargo.tomlの=1.2.161）。更新は本人が判断して手で行う。
  ignore:
  - dependency-name: velopack
  schedule:
    interval: weekly
    day: monday
    time: '09:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: deps
- package-ecosystem: rust-toolchain
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: '09:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 5
  commit-message:
    prefix: deps
