[workspace]
members = ["tools/prunlet-fixtures", "tools/prunlet-support"]
default-members = ["."]
resolver = "3"

[package]
name = "prunlet"
version = "1.0.46"
edition = "2024"
rust-version = "1.100.0"
publish = false
authors = ["Kagayoi"]
license = "MIT"

[lib]
path = "src/rust/lib.rs"

[[bin]]
name = "prunlet"
path = "src/rust/main.rs"

[[bin]]
name = "prunlet-maintenance"
path = "src/rust/bin/maintenance.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "9.2", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
native-tls = "0.2"
tokio = { version = "1", features = ["net", "rt", "time", "io-util", "sync"] }
tokio-native-tls = "0.3"
url = "2.5.8"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_RestartManager", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# fs2・libcはmacOS/Linuxの実装だけが使う。platform/mod.rsのcfgと揃え、Windowsのビルドグラフへ入れない。
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
fs2 = "0.4"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }

[target.'cfg(target_os = "linux")'.dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
